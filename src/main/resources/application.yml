spring:
  application:
    name: fieldops-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/fieldops}
    username: ${DB_USER:fieldops}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

# ── Application-specific properties ─────────────────────────────────
app:
  cors:
    allowed-origins: http://localhost:4200,http://localhost:3000

# ── Logging ─────────────────────────────────────────────────────────
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true

---
spring:
  config:
    activate:
      on-profile: integracao
  jpa:
    show-sql: false

---
spring:
  config:
    activate:
      on-profile: demo
  jpa:
    show-sql: false
logging:
  level:
    com.fieldops: DEBUG
