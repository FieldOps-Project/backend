services:
  db:
    image: postgres:16-alpine
    container_name: fieldops-db
    environment:
      POSTGRES_DB: fieldops
      POSTGRES_USER: fieldops
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - fieldops-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fieldops" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: fieldops-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  fieldops-pgdata:
